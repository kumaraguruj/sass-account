<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sri Ayyappa Swamy Seva Sangam — Income &amp; Expenses 2026</title>
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <!-- Chart.js, jsPDF & Google Identity Services -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            display: ['Plus Jakarta Sans', 'Inter', 'system-ui', 'sans-serif']
          },
          boxShadow: {
            soft: '0 1px 2px rgba(15, 23, 42, 0.04), 0 8px 24px -12px rgba(15, 46, 46, 0.08)',
            card: '0 1px 3px rgba(15, 23, 42, 0.05), 0 12px 32px -16px rgba(15, 61, 58, 0.14)'
          }
        }
      }
    };
  </script>
  <style>
    html, body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #f8f7f4;
      background-image: radial-gradient(at 0% 0%, rgba(13, 148, 136, 0.07) 0px, transparent 50%),
                        radial-gradient(at 100% 0%, rgba(217, 119, 6, 0.06) 0px, transparent 45%);
      background-attachment: fixed;
      color: #0f172a;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }
    h1, h2, h3, .font-display {
      font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
      letter-spacing: -0.02em;
    }
    .sticky-head th {
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: #f8fafc;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
    .app-view {
      display: none;
    }
    .app-view.is-active {
      display: block;
      animation: fadeSlideIn 0.2s ease-out;
    }
    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    @media (max-width: 640px) {
      input, select, textarea {
        font-size: 16px !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-900 antialiased">
  <!-- Top Deep Forest Teal Header (Clean Text-Only, No Logo) -->
  <header class="bg-gradient-to-r from-[#0c2d2c] via-[#113f3c] to-[#1c2e35] text-white shadow-lg border-b border-white/10 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-3.5 sm:py-4">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-3">
        <!-- Organization Title & Mobile Quick Controls -->
        <div class="flex items-start justify-between gap-2">
          <div class="min-w-0">
            <h1 class="text-lg sm:text-2xl font-extrabold tracking-tight text-white leading-snug break-words">
              Sri Ayyappa Swamy Seva Sangam
            </h1>
            <p class="text-[11px] sm:text-xs text-teal-200/85 mt-0.5 truncate">
              Komaleeswaranpet, Chennai - 600 002 · Income &amp; Expenses - 2026 · Chronological Order
            </p>
          </div>
          <!-- Mobile Sync & Banner Toggle Controls -->
          <div class="flex lg:hidden items-center gap-1.5 shrink-0">
            <button id="btnManualSyncMobile" type="button" title="Sync Now" aria-label="Sync Now"
              class="min-w-[40px] min-h-[40px] rounded-xl bg-white/10 hover:bg-white/20 active:bg-white/25 text-white border border-white/15 backdrop-blur-sm transition cursor-pointer flex items-center justify-center">
              <span class="sync-icon inline-block text-base leading-none">&#8635;</span>
            </button>
            <button id="btnToggleBannerMobile" type="button" title="Toggle status banner" aria-label="Toggle status banner"
              class="min-w-[40px] min-h-[40px] rounded-xl bg-white/10 hover:bg-white/20 active:bg-white/25 text-white border border-white/15 backdrop-blur-sm transition cursor-pointer flex items-center justify-center">
              <svg class="banner-chevron w-4 h-4 transition-transform" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
              </svg>
            </button>
          </div>
        </div>

        <!-- Primary Action Bar -->
        <div class="grid grid-cols-3 sm:flex sm:flex-wrap items-center gap-2">
          <select id="currencySelect" aria-label="Currency"
            class="min-h-[4
